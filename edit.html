<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity - Master Review Node</title>
    <style>
        :root { --bg: #000000; --fg: #ffffff; --c-blue: #007bff; --c-red: #ff4444; --c-green: #00C851; --c-yellow: #ffbb33; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-blue); }

        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg) !important; 
            color: var(--fg) !important; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow-x: hidden; 
            opacity: 0; transition: opacity 1s ease-in-out; padding-bottom: 50px;
        }

        .top-left { position: fixed; top: clamp(15px, 4vw, 30px); left: clamp(15px, 4vw, 30px); cursor: pointer; opacity: 0.6; transition: 0.3s; color: inherit; display: flex; align-items: center; justify-content: center; text-decoration: none; z-index: 100; }
        .top-left:hover { opacity: 1; color: var(--c-blue); }
        .top-left span { font-weight: 900; letter-spacing: 2px; font-size: 13px; }

        .master-wrapper { width: 90%; max-width: 650px; margin-top: 100px; animation: fadeIn 0.6s ease; }
        
        .brand-title { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; margin-bottom: 8px; text-align: center; }
        h1 { font-weight: bold; margin-top: 0; margin-bottom: 30px; font-size: clamp(22px, 6vw, 32px); text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        
        .review-card { border: 1px solid rgba(128,128,128,0.2); border-radius: 16px; background: rgba(128,128,128,0.01); backdrop-filter: blur(10px); padding: 25px; margin-bottom: 25px; width: 100%; box-sizing: border-box; }
        
        .step-tag { font-size: 9px; font-weight: bold; color: var(--c-blue); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; display: block; }
        
        .review-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(128,128,128,0.2); padding-bottom: 12px; margin-bottom: 18px; }
        .review-title { font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 10px; }
        .review-title svg { width: 18px; height: 18px; fill: var(--c-blue); }
        
        .btn-edit-section { font-size: 10px; font-weight: bold; text-decoration: none; color: var(--c-blue); border: 1px solid var(--c-blue); padding: 6px 12px; border-radius: 6px; transition: all 0.3s; letter-spacing: 1px; }
        .btn-edit-section:hover { background: var(--c-blue); color: #000000; }

        .data-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .data-item { display: flex; flex-direction: column; gap: 4px; }
        .data-label { font-size: 10px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .data-value { font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; word-break: break-word; }
        .data-value.lowercase { text-transform: lowercase; }
        
        .img-preview-wrapper { position: relative; width: 80px; height: 80px; margin-top: 5px; cursor: pointer; transition: transform 0.3s ease; display: inline-block; }
        .img-preview-wrapper:hover { transform: scale(1.1); }
        .img-preview-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--c-blue); background: #050505; }
        .verified-badge { position: absolute; top: 0px; right: -5px; width: 22px; height: 22px; background: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(0,200,81,0.5); z-index: 10; transform: translate(10%, -10%); }
        .verified-badge svg { width: 14px; height: 14px; fill: var(--c-green); }

        .btn-final { width: 100%; padding: 16px; background: transparent; color: var(--c-green); border: 1px solid var(--c-green); border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.4s ease; letter-spacing: 2px; text-transform: uppercase; margin-top: 20px; display: flex; align-items: center; justify-content: center; }
        .btn-final:hover { background: var(--c-green) !important; color: #000000 !important; box-shadow: 0 5px 20px rgba(0, 200, 81, 0.4); }
        .btn-final:active { transform: scale(0.98); }
        
        .btn-final.processing { opacity: 1 !important; pointer-events: none; background: var(--c-yellow) !important; border-color: var(--c-yellow) !important; color: #000000 !important; box-shadow: 0 5px 15px rgba(255, 187, 51, 0.3); }

        .wave-dots { display: inline-block; margin-left: 2px; }
        .wave-dots span { display: inline-block; animation: wave 1.2s infinite ease-in-out; }
        .wave-dots span:nth-child(1) { animation-delay: 0s; }
        .wave-dots span:nth-child(2) { animation-delay: 0.2s; }
        .wave-dots span:nth-child(3) { animation-delay: 0.4s; }

        .info-carousel { font-size: clamp(11px, 2.5vw, 13px); opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; transition: opacity 0.5s ease-in-out; pointer-events: none; height: 20px; margin-top: 25px; text-align: center; width: 100%; display: flex; align-items: center; justify-content: center; }
        .spinner-inline { display: inline-block; width: 12px; height: 12px; border: 2px solid transparent; border-top-color: var(--c-cyan); border-right-color: var(--c-cyan); border-radius: 50%; animation: spin 1s linear infinite; margin-left: 8px; }

        /* Fullscreen Image Modal */
        .img-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .img-modal-overlay.show { opacity: 1; pointer-events: auto; }
        .img-modal-content { max-width: 90vw; max-height: 90vh; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 123, 255, 0.2); object-fit: contain; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); border: 2px solid var(--c-blue); }
        .img-modal-overlay.show .img-modal-content { transform: scale(1); }
        .img-modal-close { position: absolute; top: clamp(20px, 5vw, 40px); right: clamp(20px, 5vw, 40px); background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: var(--fg); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; font-weight: bold; transition: all 0.3s; z-index: 10000; }
        .img-modal-close:hover { background: var(--c-red); border-color: var(--c-red); transform: rotate(90deg); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .master-wrapper { margin-top: 80px; width: 92%; }
            .review-card { padding: 18px; }
        }
    </style>
</head>
<body>

    <a href="registration11.html" class="top-left">
        <span>BACK</span>
    </a>

    <div class="master-wrapper">
        <div class="brand-title">Infinity Master Control</div>
        <h1><strong>Master Review Node</strong></h1>

        <div id="reviewContainer"></div>

        <button id="btnProceed" class="btn-final" onclick="proceedToConfirm()">FINALIZE IDENTITY ✔</button>

        <div id="infoCarousel" class="info-carousel">System Architecture Integrity: Verified<div class="spinner-inline"></div></div>
    </div>

    <div class="img-modal-overlay" id="imgModal" onclick="closeFullscreenImg(event)">
        <div class="img-modal-close" onclick="closeFullscreenImg(event, true)">&#10005;</div>
        <img src="" class="img-modal-content" id="fullImg">
    </div>

    <script src="brain.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.opacity = '1'; }, 100);
            loadMasterData();
        });

        function loadMasterData() {
            let s = {};
            try {
                s = JSON.parse(localStorage.getItem('inf_settings')) || {};
            } catch(e) {}

            const container = document.getElementById('reviewContainer');

            // Process DOB Details Live
            let bDayName = "N/A";
            let eAge = "N/A";
            let zSign = "N/A";

            if (s.dateOfBirth) {
                const parts = s.dateOfBirth.split('-');
                if (parts.length === 3) {
                    const y = parseInt(parts[0], 10);
                    const m = parseInt(parts[1], 10) - 1;
                    const d = parseInt(parts[2], 10);
                    const dateObj = new Date(y, m, d);

                    bDayName = dateObj.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();

                    const month = m + 1;
                    const day = d;
                    if ((month == 1 && day <= 20) || (month == 12 && day >= 22)) zSign = "CAPRICORN ♑";
                    else if ((month == 1 && day >= 21) || (month == 2 && day <= 18)) zSign = "AQUARIUS ♒";
                    else if ((month == 2 && day >= 19) || (month == 3 && day <= 20)) zSign = "PISCES ♓";
                    else if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) zSign = "ARIES ♈";
                    else if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) zSign = "TAURUS ♉";
                    else if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) zSign = "GEMINI ♊";
                    else if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) zSign = "CANCER ♋";
                    else if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) zSign = "LEO ♌";
                    else if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) zSign = "VIRGO ♍";
                    else if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) zSign = "LIBRA ♎";
                    else if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) zSign = "SCORPIO ♏";
                    else if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) zSign = "SAGITTARIUS ♐";

                    const today = new Date();
                    let ageY = today.getFullYear() - dateObj.getFullYear();
                    let ageM = today.getMonth() - dateObj.getMonth();
                    let ageD = today.getDate() - dateObj.getDate();
                    
                    if (ageD < 0) {
                        ageM--;
                        const temp = new Date(today.getFullYear(), today.getMonth(), 0);
                        ageD += temp.getDate();
                    }
                    if (ageM < 0) {
                        ageY--;
                        ageM += 12;
                    }
                    
                    eAge = `${ageY} YRS`;
                    if (ageM > 0) eAge += `, ${ageM} MO`;
                    if (ageD > 0) eAge += `, ${ageD} DAYS`;
                }
            }

            let cleanPhoneCountry = s.phoneCountryName ? s.phoneCountryName.split(' (')[0].toUpperCase() : "N/A";
            let cleanGuardCountry = s.guardianPhoneCountryName ? s.guardianPhoneCountryName.split(' (')[0].toUpperCase() : "N/A";
            
            let cleanPrimaryPhone = s.verifiedPhone || "N/A";
            if (s.phoneCountryCode && cleanPrimaryPhone.startsWith(s.phoneCountryCode)) {
                cleanPrimaryPhone = cleanPrimaryPhone.replace(s.phoneCountryCode, '').trim();
            }
            
            let cleanGuardianPhone = s.guardianPhone || "N/A";
            if (s.guardianPhoneCountryCode && cleanGuardianPhone.startsWith(s.guardianPhoneCountryCode)) {
                cleanGuardianPhone = cleanGuardianPhone.replace(s.guardianPhoneCountryCode, '').trim();
            }

            const sections = [
                {
                    step: "STEP 1 OF 11",
                    title: "Identity Baseline",
                    link: "registration.html?edit=true",
                    icon: `<path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/>`,
                    data: [
                        { label: "Name Given at Birth", val: s.birthName },
                        { label: "Current Legal Name", val: s.currentName }
                    ]
                },
                {
                    step: "STEP 2 OF 11",
                    title: "Temporal Origin",
                    link: "registration2.html?edit=true",
                    icon: `<path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/>`,
                    data: [
                        { label: "Birth Country", val: s.birthCountry },
                        { label: "Nationality", val: s.nationality },
                        { label: "Date of Birth", val: s.dateOfBirth },
                        { label: "Birth Day Name", val: bDayName },
                        { label: "Current Age", val: eAge },
                        { label: "Zodiac Parameter", val: zSign }
                    ]
                },
                {

                    title: "Biological Baseline",
                    link: "registration3.html?edit=true",
                    icon: `<path d="M17.5,10C19.43,10 21,8.43 21,6.5C21,4.57 19.43,3 17.5,3C15.57,3 14,4.57 14,6.5C14,7.46 14.39,8.34 15,9L11.44,12.56C10.54,11.57 9.25,11 8,11A5,5 0 0,0 3,16A5,5 0 0,0 8,21A5,5 0 0,0 13,16C13,14.75 12.43,13.46 11.44,12.56L15,9C15.66,9.61 16.54,10 17.5,10M17.5,5C18.33,5 19,5.67 19,6.5C19,7.33 18.33,8 17.5,8C16.67,8 16,7.33 16,6.5C16,5.67 16.67,5 17.5,5M8,13A3,3 0 0,1 11,16A3,3 0 0,1 8,19A3,3 0 0,1 5,16A3,3 0 0,1 8,13Z"/>`,
                    data: [

                    icon: `<path d="M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2M12,4A5,5 0 0,1 17,9C17,12.44 13.92,17.43 12,19.82C10.08,17.41 7,12.43 7,9A5,5 0 0,1 12,4M12,6.5A2.5,2.5 0 0,0 9.5,9A2.5,2.5 0 0,0 12,11.5A2.5,2.5 0 0,0 14.5,9A2.5,2.5 0 0,0 12,6.5Z"/>`,
                    data: [

                        { label: "Country / State", val: `${s.locationData?.country || ''} / ${s.locationData?.state || ''}` },
                        { label: "District / Sub District", val: `${s.locationData?.district || ''} / ${s.locationData?.subDistrict || ''}` },
                        { label: "Local Body Type / Area Category", val: `${s.locationData?.localBody || ''} (${s.locationData?.areaCategory || ''})` },

                        { label: "House / Plot Name & No.", val: `${s.locationData?.houseName || ''} (H.NO: ${s.locationData?.houseNo || ''})` },
                        { label: "Nearest Core Landmark", val: s.locationData?.landmark },

                        { label: "Manual Full Address Structure", val: s.locationData?.manualAddress },

                    data: [
                        { label: "Primary Country", val: cleanPhoneCountry },
                        { label: "Country Code", val: s.phoneCountryCode || "N/A" },
                        { label: "Primary Mobile Number", val: s.verifiedPhone ? cleanPrimaryPhone + " <span style='color:var(--c-green);'> (VERIFIED ✔)</span>" : "N/A" }
                    ]
                },
                {
                    step: "STEP 6 OF 11",
                    title: "Medical Baseline Node",
                    link: "registration6.html?edit=true",
                    icon: `<path d="M12,2C12,2 21,7 21,13C21,16.87 16.87,21 12,21C7.13,21 3,16.87 3,13C3,7 12,2 12,2M12,4.81C7,8.69 5,12.78 5,13C5,15.9 7.42,19 12,19C16.58,19 19,13C19,12.78 17,8.69 12,4.81M15,10V12H13V15H11V12H9V10H11V7H13V10H15Z"/>`,
                    data: [
                        { label: "Designated Blood Group", val: s.bloodGroup }
                    ]
                },
                {
                    step: "STEP 7 OF 11",
                    title: "Guardian Authorization Node",
                    link: "registration7.html?edit=true",
                    icon: `<path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/>`,

                {

                    data: [

                        { label: "Current Denomination / Sect", val: s.denomination ? (s.denomination === "Other" ? s.customDenomination : s.denomination) : "N/A" },
                        { label: "Current Rule Practice Level", val: s.practiceLevel || "N/A" },
                        { label: "Community Caste Category", val: s.category ? (s.category === "Other" ? s.customCategory : s.category) : "N/A" }
                    ]
                },
                {
                    step: "STEP 9 OF 11",
                    title: "Alternate Secure Email Node",
                    link: "registration9.html?edit=true",
                    icon: `<path d="M20,4H4C2.89,4 2,4.89 2,6V18C2,19.1 2.89,20 4,20H20C21.1,20 22,19.1 22,18V6C22,4.89 21.1,4 20,4M20,8L12,13L4,8V6L12,11L20,6V8Z"/>`,
                    data: [
                        { label: "Emergency Contact Alternate Email", val: s.emailSkipped ? "SKIPPED" : (s.emergencyContact?.email ? s.emergencyContact.email + " <span style='color:var(--c-green);'> (VERIFIED ✔)</span>" : "N/A"), lowercase: !s.emailSkipped }
                    ]
                },
                {
                    step: "STEP 10 OF 11",
                    title: "Physical frame Mark Identification",
                    link: "registration10.html?edit=true",
                    icon: `<path d="M12,2C6.47,2 2,6.47 2,12C2,17.53 6.47,22 12,22C17.53,22 22,17.53 22,12C22,6.47 17.53,2 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 12,20M15.5,13.5A1.5,1.5 0 1,1 17,12A1.5,1.5 0 0,1 15.5,13.5M8.5,13.5A1.5,1.5 0 1,1 10,12A1.5,1.5 0 0,1 8.5,13.5M12,17.5C14.33,17.5 16.31,16.04 17.11,14H6.89C7.69,16.04 9.67,17.5 12,17.5Z"/>`,
                    data: [
                        { label: "Biometric Mark Parameter 1", val: s.identificationMarks?.mark1 },
                        { label: "Biometric Mark Parameter 2", val: s.identificationMarks?.mark2 }
                    ]
                },
                {
                    step: "STEP 11 OF 11",
                    title: "User Picture",
                    link: "registration11.html?edit=true",
                    icon: `<path d="M4,4H7V2H4A2,2 0 0,0 2,4V7H4V4M20,2H17V4H20V7H22V4A2,2 0 0,0 20,2M20,20H17V22H20A2,2 0 0,0 22,20V17H20V20M4,20V17H22V20A2,2 0 0,0 4,20M12,6A5,5 0 0,0 7,11A5,5 0 0,0 12,16A5,5 0 0,0 17,11A5,5 0 0,0 12,6M12,14A3,3 0 0,1 9,11A3,3 0 0,1 12,8A3,3 0 0,1 15,11A3,3 0 0,1 12,14Z"/>`,
                    isPhoto: true
                }
            ];

            let htmlStr = "";
            let editIcon = `<svg style="width:10px; height:10px; fill:currentColor; margin-left:3px; vertical-align:middle;" viewBox="0 0 24 24"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/></svg>`;

            sections.forEach(sec => {
                let itemsHtml = "";
                
                if (sec.isPhoto) {
                    itemsHtml = `
                        <div class="data-item">
                            <span class="data-label">AUTHENTICATED BIOMETRIC MATRIX</span>
                            <div class="img-preview-wrapper" onclick="openFullscreenImg(this)">
                                <img src="${s.capturedPhoto || ''}" alt="Biometric Face Preview" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'80\\' height=\\'80\\' viewBox=\\'0 0 24 24\\'><circle cx=\\'12\\' cy=\\'12\\' r=\\'10\\' fill=\\'%23111\\'/><path d=\\'M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z\\' fill=\\'%23555\\'/></svg>'">
                                <div class="verified-badge"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"/></svg></div>
                            </div>
                        </div>
                    `;
                } else {
                    sec.data.forEach(item => {
                        let valContent = item.val ? item.val : `<span style="color:var(--c-red); font-size:11px;">N/A</span>`;
                        let addClass = item.lowercase ? 'lowercase' : '';
                        itemsHtml += `
                            <div class="data-item">
                                <span class="data-label">${item.label}</span>
                                <span class="data-value ${addClass}">${valContent}</span>
                            </div>
                        `;
                    });
                }

                htmlStr += `
                    <div class="review-card">
                        <span class="step-tag">${sec.step}</span>
                        <div class="review-header">
                            <div class="review-title">
                                <svg viewBox="0 0 24 24">${sec.icon}</svg>
                                ${sec.title}
                            </div>
                            <a href="${sec.link}" class="btn-edit-section">
                                MODIFY ${editIcon}
                            </a>
                        </div>
                        <div class="data-grid ${sec.gridClass || ''}">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlStr;
        }

        function openFullscreenImg(container) {
            const imgSrc = container.querySelector('img').src;
            if (imgSrc && !imgSrc.includes('svg+xml')) {
                document.getElementById('fullImg').src = imgSrc;
                document.getElementById('imgModal').classList.add('show');
            }
        }

        function closeFullscreenImg(e, force = false) {
            if (force || e.target.id === 'imgModal') {
                document.getElementById('imgModal').classList.remove('show');
                setTimeout(() => { document.getElementById('fullImg').src = ''; }, 300);
            }
        }

        function proceedToConfirm() {
            const btn = document.getElementById('btnProceed');
            btn.classList.add('processing');
            btn.innerHTML = 'FINALIZING NODE<span class="wave-dots"><span>.</span><span>.</span><span>.</span></span>';
            btn.style.pointerEvents = 'none';

            setTimeout(() => {
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = 'confirm.html'; 
                }, 1000);
            }, 2000);
        }

        const archInfo = [
            "System Architecture Integrity: Verified",
            "Establishing Secure Cryptographic Tunnels",
            "End-to-End AES-GCM Encryption Active",
            "Synchronizing Decentralized Nodes",
            "Zero-Knowledge Proofs Validated",
            "Protecting Digital Footprint...",
            "Private Data Exclusively Controlled",
            "Monitoring Network Latency",
            "Awaiting User Authorization",
            "Quantum-Resistant Protocols Engaged"
        ];
        let infoIndex = 0;
        setInterval(() => {
            const el = document.getElementById('infoCarousel');
            if(el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    infoIndex = (infoIndex + 1) % archInfo.length;
                    el.innerHTML = archInfo[infoIndex] + '<div class="spinner-inline"></div>';
                    el.style.opacity = '0.6';
                }, 500);
            }
        }, 3000);
    </script>
</body>
</html>
