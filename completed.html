<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity - Registration Complete</title>
    <style>
        :root { --bg: #000000; --fg: #ffffff; --c-blue: #007bff; --c-green: #00C851; --c-yellow: #ffbb33; }
        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg) !important; 
            color: var(--fg) !important; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; text-align: center; 
            opacity: 0;
            transition: opacity 1s ease-in-out;
            user-select: none;
        }

        /* Success Badge Circular Design */
        .success-icon { width: clamp(80px, 20vw, 100px); height: clamp(80px, 20vw, 100px); border-radius: 50%; border: 3px solid var(--c-green); background: rgba(0, 200, 81, 0.1); display: flex; align-items: center; justify-content: center; margin-bottom: clamp(20px, 5vh, 30px); animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 0 30px rgba(0, 200, 81, 0.3); }
        .success-icon svg { width: clamp(40px, 10vw, 50px); height: clamp(40px, 10vw, 50px); fill: var(--c-green); filter: drop-shadow(0 0 5px rgba(0, 200, 81, 0.5)); }
        
        .title { font-size: clamp(20px, 6vw, 28px); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; color: var(--c-green); text-shadow: 0 0 10px rgba(0,200,81,0.3); animation: slideUp 0.5s ease 0.2s both; }
        
        /* Message Box with Rounded Smooth Corners */
        .message-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: clamp(15px, 5vw, 25px); border-radius: 15px; max-width: 380px; width: 85%; animation: slideUp 0.5s ease 0.4s both; backdrop-filter: blur(10px); }
        .message-box p { margin: 0 0 15px 0; font-size: clamp(12px, 3.5vw, 13px); line-height: 1.6; opacity: 0.7; letter-spacing: 0.5px; }
        .message-box .highlight { font-size: clamp(13px, 4vw, 14px); font-weight: bold; color: var(--fg); opacity: 1; margin: 0; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 15px; }

        /* Smooth Background Hover Action Button */
        .btn-done { 
            background: transparent; 
            color: var(--c-blue); 
            border: 1px solid var(--c-blue); 
            padding: clamp(14px, 4vw, 16px) clamp(30px, 8vw, 50px); 
            border-radius: 12px; 
            font-size: clamp(11px, 3vw, 13px); 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            cursor: pointer; 
            margin-top: clamp(30px, 8vh, 40px); 
            animation: slideUp 0.5s ease 0.6s both; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            outline: none; 
            position: relative; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
        }
        .btn-done:hover:not(.filled):not(.processing) { background: var(--c-blue) !important; color: #ffffff !important; border-color: var(--c-blue) !important; box-shadow: 0 0 20px rgba(0, 123, 255, 0.4); }
        .btn-done.processing { background: var(--c-yellow) !important; border-color: var(--c-yellow) !important; color: #000 !important; pointer-events: none; box-shadow: 0 0 20px rgba(255, 187, 51, 0.3); min-width: 220px; }
        .btn-done.filled { background: var(--c-green) !important; border-color: var(--c-green) !important; color: #000 !important; box-shadow: 0 0 20px rgba(0, 200, 81, 0.4); pointer-events: none; min-width: 200px; }
        .btn-done:active { transform: scale(0.95); }

        /* Waving Dots Styles */
        .wave-dots span { display: inline-block; animation: wave 1.2s infinite both; }
        .wave-dots span:nth-child(2) { animation-delay: 0.2s; }
        .wave-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes scaleIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

    <div class="success-icon">
        <svg viewBox="0 0 24 24"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>
    </div>

    <div class="title">Upload Success</div>
    
    <div class="message-box">
        <p>All biometric and geospatial data has been securely encrypted and transmitted to the Infinity Master Server Grid. Your digital footprint is now securely mapped.</p>
        <p class="highlight">Your account verification process will be completed within 3 to 5 working days.</p>
    </div>

    <button class="btn-done" id="btnViewBill" onclick="handleViewBill(this)">VIEW BILL</button>

    <script src="brain.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Smooth 1 Second Page Fade In
            setTimeout(() => { document.body.style.opacity = '1'; }, 100);
        });

        function handleViewBill(btn) {
            // Turn button into yellow processing state with waving dots
            btn.classList.add('processing');
            btn.innerHTML = 'GENERATING<span class="wave-dots"><span>.</span><span>.</span><span>.</span></span>';
            
            // Show Generating for 3 seconds, then turn green success state
            setTimeout(() => {
                btn.classList.remove('processing');
                btn.classList.add('filled');
                btn.innerHTML = 'BILL GENERATED';
                
                // Wait 1 second after success, then smoothly fade out page
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    
                    // Wait 1 second for fade out to complete, then navigate to bill.html
                    setTimeout(() => {
                        window.location.href = 'bill.html';
                    }, 1000);
                }, 1000);
            }, 3000);
        }
    </script>
</body>
</html>
