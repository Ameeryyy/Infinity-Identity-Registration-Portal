<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Preferences</title>
    <style>
        :root, [data-theme="minimal-dark"] { --bg: #000000; --fg: #ffffff; --c-blue: #007bff; --c-red: #ff4444; --c-green: #00C851; --c-yellow: #ffbb33; --c-cyan: #00e5ff; }
        
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            overflow: hidden !important;
            overscroll-behavior: none;
        }

        body * {
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }

        body { 
            background-color: var(--bg) !important; 
            color: var(--fg) !important; 
            display: flex; justify-content: center; align-items: center; 
            font-family: system-ui, -apple-system, sans-serif; 
            transition: background-color 0.5s ease, color 0.5s ease, opacity 1s ease-in-out;
            opacity: 0;
        }

        .top-left { position: absolute; top: clamp(15px, 4vw, 30px); left: clamp(15px, 4vw, 30px); cursor: pointer; opacity: 0.6; color: inherit; display: flex; align-items: center; justify-content: center; text-decoration: none; z-index: 10; font-size: 14px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; transition: opacity 0.3s, color 0.3s; }
        .top-left:hover { opacity: 1; color: var(--c-blue); }
        
        .container { width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 20px; box-sizing: border-box; z-index: 10; border: 1px solid rgba(128,128,128,0.2); border-radius: 16px; background: rgba(128,128,128,0.02); backdrop-filter: blur(10px); }
        .container::-webkit-scrollbar { display: none; }
        
        .settings-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
        .header-gear { width: 45px; height: 45px; fill: var(--c-blue); margin-bottom: 12px; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .settings-header:hover .header-gear { transform: rotate(180deg); }
        
        h2 { font-weight: bold; margin: 0; text-align: center; text-transform: uppercase; letter-spacing: 3px; font-size: 18px; }
        
        .setting-group { margin-bottom: 30px; }
        .setting-group h3 { font-size: 14px; font-weight: bold; margin-bottom: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; border-left: 3px solid var(--c-blue); padding-left: 10px; }
        
        .theme-alert { font-size: 11px; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: left; line-height: 1.5; transition: all 0.4s ease; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-group.full { grid-template-columns: 1fr; margin-top: 10px; }
        button { padding: 14px; border: 1px dashed rgba(128,128,128,0.3); background: rgba(128,128,128,0.05); color: inherit; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; }
        button:hover { border-color: var(--c-blue); background: rgba(128,128,128,0.1); }
        button.active { background: var(--fg); color: var(--bg); border-style: solid; border-color: var(--fg); }
        
        @media (max-width: 768px) { .container { border: none; background: transparent; backdrop-filter: none; } }
    </style>
</head>
<body>

    <a href="#" class="top-left" onclick="goBack(event)">BACK</a>

    <div class="container">
        
        <div class="settings-header">
            <svg class="header-gear" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
            <h2>SYSTEM PREFERENCES</h2>
        </div>
        
        <div class="setting-group">
            <h3>Appearance Mode</h3>
            
            <div id="theme-alert" class="theme-alert"></div>
            
            <div class="btn-group" style="margin-bottom: 10px;">
                <button id="theme-dark" onclick="setMode('dark')">Dark Theme</button>
                <button id="theme-light" onclick="setMode('light')">Light Theme</button>
            </div>
            <div class="btn-group full">
                <button id="theme-system" onclick="setMode('system')">System Default</button>
            </div>
        </div>
        
    </div>

    
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.opacity = '1'; }, 100);
            updateUI();
        });

        function goBack(e) {
            e.preventDefault();
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'landing.html';
            }, 1000);
        }

        function updateUI() {
            const currentTheme = localStorage.getItem('inf_theme') || 'dark';
            document.getElementById('theme-dark').classList.remove('active');
            document.getElementById('theme-light').classList.remove('active');
            document.getElementById('theme-system').classList.remove('active');
            
            const activeBtn = document.getElementById('theme-' + currentTheme);
            if(activeBtn) activeBtn.classList.add('active');

            const themeAlert = document.getElementById('theme-alert');
            if(currentTheme === 'dark') {
                themeAlert.style.background = 'rgba(0, 200, 81, 0.08)';
                themeAlert.style.color = 'var(--c-green)';
                themeAlert.style.border = '1px solid rgba(0, 200, 81, 0.3)';
                themeAlert.innerHTML = '✔ EXCELLENT CHOICE: DARK THEME PROVIDES EYE PROTECTION, MAXIMIZES BATTERY EFFICIENCY, AND ENSURES A BUG-FREE EXPERIENCE.';
            } else if (currentTheme === 'light') {
                themeAlert.style.background = 'rgba(255, 68, 68, 0.08)';
                themeAlert.style.color = 'var(--c-red)';
                themeAlert.style.border = '1px solid rgba(255, 68, 68, 0.3)';
                themeAlert.innerHTML = '⚠ WARNING: LIGHT THEME MAY CAUSE HIGHER BATTERY DRAIN, EYE STRAIN, AND INCREASE THE CHANCE OF UI RENDERING BUGS.';
            } else {
                themeAlert.style.background = 'rgba(255, 187, 51, 0.08)';
                themeAlert.style.color = 'var(--c-yellow)';
                themeAlert.style.border = '1px solid rgba(255, 187, 51, 0.3)';
                themeAlert.innerHTML = '⚠ CAUTION: SYSTEM THEME CAN DYNAMICALLY CHANGE BASED ON DEVICE SETTINGS WHICH MIGHT CAUSE DISPLAY ISSUES. DARK THEME IS HIGHLY RECOMMENDED.';
            }
        }

        function setMode(m) { 
            if(window.setGlobalTheme) {
                window.setGlobalTheme(m);
            } else {
                localStorage.setItem('inf_theme', m);
                window.dispatchEvent(new Event('themeChanged'));
            }
        }

        window.addEventListener('themeChanged', updateUI);
    </script>
    <script src="brain.js"></script>
</body>
</html>
