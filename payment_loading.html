<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity - Processing Payment</title>
    <style>
        :root { --bg: #000000; --fg: #ffffff; --c-blue: #007bff; --c-green: #00C851; --c-yellow: #ffbb33; }
        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg) !important; 
            color: var(--fg) !important; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; 
            opacity: 0; 
            transition: background-color 0.5s ease, color 0.5s ease, opacity 1s ease-in-out;
            user-select: none;
        }

        .status-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        
        .circle-loader { position: relative; width: 80px; height: 80px; margin-bottom: 25px; }
        .spinner { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 3px solid rgba(0, 123, 255, 0.2); border-top-color: var(--c-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        
        .success-circle { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--c-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: scale(0); opacity: 0; box-shadow: 0 0 30px rgba(0, 200, 81, 0.4); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s; }
        .success-circle svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
        .success-circle.show { transform: scale(1); opacity: 1; }
        .success-circle.show svg { animation: drawCheck 0.5s ease 0.2s forwards; }

        .status-text { font-size: 16px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; color: var(--c-blue); transition: color 0.3s, text-shadow 0.3s; }
        .status-text.success { color: var(--c-green); text-shadow: 0 0 10px rgba(0,200,81,0.4); }

        .sub-text { font-size: 10px; opacity: 0.5; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }

        .wave-dots { display: inline-block; margin-left: 2px; }
        .wave-dots span { display: inline-block; animation: wave 1.2s infinite ease-in-out; }
        .wave-dots span:nth-child(1) { animation-delay: 0s; }
        .wave-dots span:nth-child(2) { animation-delay: 0.2s; }
        .wave-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    </style>
</head>
<body>

    <div class="status-ui">
        <div class="circle-loader">
            <div class="spinner" id="spinner"></div>
            <div class="success-circle" id="successCircle">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
        </div>
        <div class="status-text" id="statusText">PROCESSING PAYMENT<span id="dots" class="wave-dots"><span>.</span><span>.</span><span>.</span></span></div>
        <div class="sub-text" id="subStatusText">PLEASE DO NOT CLOSE THIS WINDOW</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Smooth 1 Second Page Fade In matching other pages
            setTimeout(() => { document.body.style.opacity = '1'; }, 100);

            // Simulate payment processing delay (3 seconds)
            setTimeout(() => {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('successCircle').classList.add('show');
                
                const statusText = document.getElementById('statusText');
                statusText.innerHTML = 'PAYMENT SUCCESSFUL';
                statusText.classList.add('success');
                
                document.getElementById('subStatusText').innerText = 'REDIRECTING TO ENCRYPTION PROTOCOL...';

                // Navigate to next page after showing success message with complete fade out
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    setTimeout(() => {
                        window.location.href = 'payment_success.html';
                    }, 1000); // Wait 1 full second for the fade out to completely hide everything
                }, 2000);
            }, 3000);
        });
    </script>
</body>
</html>
